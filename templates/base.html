<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}base{% endblock %}</title>

        <!--fonte fredoka(peso: 500) nunito(peso: 400-700 )-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <nav aria-label="Principal">
            <a href="{{ url_for('site.home') }}"> Início</a>
            <a href="{{ url_for('site.servicos') }}">Serviços</a>
        </nav>
    </header>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
            <p>Focinho Limpo</p>
            <h2>Horários:</h2>
            <ul>
                <li>Segunda a sexta: 8h às 18h (horário de almoço das 12h às 13h)</li>
                <li>Sábado: 8h às 14h</li>
            </ul>
            <address>
                <p>Rua das Acácias, 128, Jardim Primavera.</p>
            <a href="#">Privacidade</a>
    </footer>
</body>
</html>
